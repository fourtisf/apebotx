<!-- ApeBotX horizontal lockup (monogram + wordmark). Press / external use.
     Wordmark uses a geometric system-font stack so the file is self-contained;
     the in-app lockup renders the real Clash Display via <BrandLockup />. -->
<svg xmlns="http://www.w3.org/2000/svg" width="248" height="60" viewBox="0 0 248 60" fill="none" role="img" aria-label="ApeBotX">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.75" result="bl"/>
      <feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(8 8) scale(1.375)">
    <rect x="0" y="0" width="32" height="32" rx="9" fill="#000000"/>
    <g filter="url(#g)">
      <path d="M7 25 L16 9.4 L25 25" stroke="url(#b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11.4 18.4 H20.6" stroke="url(#b)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="16" cy="6.4" r="2.15" fill="url(#b)"/>
    </g>
  </g>
  <text x="68" y="38" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="-0.5" fill="#f3f5f7">ApeBot<tspan fill="#7c4dff">X</tspan></text>
</svg>
