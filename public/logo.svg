<!-- Ocolos horizontal lockup (bot-head mark + wordmark). Press / external use.
     Wordmark uses a geometric system-font stack so the file is self-contained;
     the in-app lockup renders the real Clash Display via <BrandLockup />. -->
<svg xmlns="http://www.w3.org/2000/svg" width="252" height="60" viewBox="0 0 252 60" fill="none" role="img" aria-label="Ocolos">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.65" result="bl"/>
      <feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(6 8) scale(1.375)" filter="url(#g)">
    <circle cx="16" cy="4.4" r="1.7" fill="url(#b)"/>
    <line x1="16" y1="6" x2="16" y2="8.7" stroke="url(#b)" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M16 8.7 L24.7 13.35 L24.7 22 L16 26.7 L7.3 22 L7.3 13.35 Z" fill="none" stroke="url(#b)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="12.6" cy="17.2" r="1.7" fill="url(#b)"/>
    <circle cx="19.4" cy="17.2" r="1.7" fill="url(#b)"/>
    <line x1="13" y1="21.6" x2="19" y2="21.6" stroke="url(#b)" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text x="60" y="38" font-family="Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="600" letter-spacing="-0.5" fill="#f3f5f7">Ocol<tspan fill="#7c4dff">os</tspan></text>
</svg>
