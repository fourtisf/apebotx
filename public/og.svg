<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#08070e"/>
  <!-- glows -->
  <circle cx="140" cy="60" r="340" fill="#7c4dff" opacity="0.11"/>
  <circle cx="1140" cy="120" r="360" fill="#22d3ee" opacity="0.09"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 157.5 H1200 M0 315 H1200 M0 472.5 H1200"/>
    <path d="M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="bl"/>
      <feMerge><feMergeNode in="bl"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- bot-head mark -->
  <g transform="translate(96,116) scale(2.9)" filter="url(#g)">
    <circle cx="16" cy="4.4" r="1.7" fill="url(#b)"/>
    <line x1="16" y1="6" x2="16" y2="8.7" stroke="url(#b)" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M16 8.7 L24.7 13.35 L24.7 22 L16 26.7 L7.3 22 L7.3 13.35 Z" fill="none" stroke="url(#b)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="12.6" cy="17.2" r="1.7" fill="url(#b)"/>
    <circle cx="19.4" cy="17.2" r="1.7" fill="url(#b)"/>
    <line x1="13" y1="21.6" x2="19" y2="21.6" stroke="url(#b)" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text x="208" y="158" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" letter-spacing="6" fill="#c9bcff">SMART-MONEY BOT · SOLANA · TELEGRAM + X</text>
  <text x="200" y="196" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" letter-spacing="2" fill="#f3f5f7" font-weight="600">Ocolos</text>
  <!-- headline -->
  <text x="96" y="360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="80" font-weight="700" fill="#f3f5f7">Automate the smartest</text>
  <text x="96" y="452" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="80" font-weight="700" fill="#f3f5f7">money on <tspan fill="#7c4dff">Solana.</tspan></text>
  <!-- sub -->
  <text x="96" y="520" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" fill="#97a0ad">Segmented wallets · anti-rug fused · real-time alerts on Telegram &amp; X</text>
  <!-- footer -->
  <text x="96" y="582" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="#626b78">powered by Fourtis</text>
</svg>
